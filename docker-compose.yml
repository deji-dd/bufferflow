services:
  bufferflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bufferflow
    restart: unless-stopped
    ports:
      - "${BUFFERFLOW_PORT:-3001}:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:3001/api/traffic/status').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  default:
    name: bufferflow_net
